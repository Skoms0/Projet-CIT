apiVersion: apps/v1
kind: Deployment
metadata:
  name: frame-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frame-viewer
  template:
    metadata:
      labels:
        app: frame-viewer
    spec:
      containers:
      - name: frame-viewer
        image: grouquet/frame-viewer:latest
        ports:
        - containerPort: 5000
---


apiVersion: v1
kind: Service
metadata:
  name: frame-viewer-service
spec:
  type: NodePort
  selector:
    app: frame-viewer
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-frame-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-frame-consumer
  template:
    metadata:
      labels:
        app: kafka-frame-consumer
    spec:
      containers:
      - name: kafka-frame-consumer
        image: grouquet/kafka-frame-consumer:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"                 # <-- à adapter
        - name: KAFKA_TOPIC
          value: "test2"
        - name: GROUP_ID
          value: "consumer-images-only"
        - name: WEB_SERVER_URL
          value: "http://frame-viewer-service:5000/api/data"
